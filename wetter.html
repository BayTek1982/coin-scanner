<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayazit Wetter</title>
<link rel="icon" type="image/svg+xml" href="icons/wetter.svg">
<meta name="theme-color" content="#0d2a4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --hg1:#0b2340; --hg2:#14507a; --hg3:#1f7a9c;
    --karte:rgba(255,255,255,.09); --rand:rgba(255,255,255,.14);
    --text:#f2f6fa; --leise:rgba(242,246,250,.62);
    --max:#ffb15c; --min:#7cc7ff; --sonne:#ffd84d; --regen:#6fb8ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--hg1)}
  body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1200px 600px at 80% -10%,rgba(255,216,77,.18),transparent 60%),
               linear-gradient(170deg,var(--hg3) 0%,var(--hg2) 35%,var(--hg1) 85%);background-attachment:fixed}
  main{max-width:860px;margin:0 auto;padding:12px 14px 30px}

  /* Kopfzeile */
  .leiste{display:flex;align-items:center;gap:8px;padding:6px 0 4px}
  .ort{flex:1;text-align:center;font-size:20px;font-weight:600;letter-spacing:.2px;cursor:pointer}
  .ort span{font-size:15px;opacity:.7;margin-right:4px}
  .rund{width:42px;height:42px;border-radius:50%;border:1px solid var(--rand);background:var(--karte);color:var(--text);
    font-size:18px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #suche{display:none;margin:8px 0}
  #suche.offen{display:block}
  #suche input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1px solid var(--rand);
    background:rgba(255,255,255,.12);color:var(--text);outline:none}
  #suche input::placeholder{color:var(--leise)}
  #treffer{margin-top:6px;border-radius:14px;overflow:hidden}
  #treffer div{padding:12px 14px;background:rgba(255,255,255,.08);border-bottom:1px solid var(--rand);cursor:pointer}
  #treffer small{color:var(--leise)}

  /* Jetzt */
  .held{text-align:center;padding:18px 0 22px}
  .held .gross{display:flex;align-items:center;justify-content:center;gap:6px}
  .held .t{font-size:88px;font-weight:300;line-height:1;letter-spacing:-3px}
  .held svg.w{width:96px;height:80px}
  .held .beschr{font-size:19px;font-weight:500;margin-top:4px}
  .held .hl{color:var(--leise);margin-top:4px;font-size:15px}
  .chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{background:var(--karte);border:1px solid var(--rand);border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--text)}

  /* Karten */
  .karte{background:var(--karte);border:1px solid var(--rand);border-radius:22px;margin-bottom:14px;padding:14px 14px 12px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.18)}
  .titel{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;
    text-transform:uppercase;letter-spacing:1px;color:var(--leise);margin:0 2px 10px}

  /* Abschnitte */
  .zeilen{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:6px}
  .zeilen>div{background:rgba(255,255,255,.05);border-radius:16px;padding:10px 2px}
  .lbl{color:var(--leise);font-size:13.5px}
  .temp{font-size:26px;font-weight:500;margin:4px 0 0}
  .sym{display:flex;align-items:center;justify-content:center;gap:2px;height:50px}
  .sym svg.w{width:52px;height:44px}
  .pfeil{width:16px;height:16px;fill:var(--leise);flex:0 0 auto}
  .klein{font-size:13px;color:var(--leise)}

  /* Tage-Auswahl */
  .wahl{display:flex;background:rgba(0,0,0,.18);border-radius:999px;padding:3px}
  .wahl button{white-space:nowrap;border:0;background:none;color:var(--leise);font:inherit;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer;text-transform:none;letter-spacing:0}
  .wahl button.an{background:#fff;color:#0d2a4a}

  /* Tagesliste */
  .tag{display:grid;grid-template-columns:78px 44px 50px 1fr;align-items:center;gap:6px;padding:8px 4px;border-top:1px solid rgba(255,255,255,.08);cursor:pointer;border-radius:12px}
  .tag:first-of-type{border-top:0}
  .tag.aktiv{background:rgba(255,255,255,.1)}
  .tag .name{font-weight:600;font-size:15px;line-height:1.2}
  .tag .name small{display:block;font-weight:400;color:var(--leise);font-size:12px}
  .tag svg.w{width:42px;height:36px}
  .tag .rg{font-size:12.5px;color:var(--regen);text-align:center;line-height:1.3}
  .tag .rg b{display:block;color:var(--sonne);font-weight:500}
  .spanne{display:flex;align-items:center;gap:8px;font-size:15px}
  .spanne .mn{width:32px;text-align:right;color:var(--min)}
  .spanne .mx{width:32px;color:var(--max);font-weight:600}
  .balken{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12);position:relative}
  .balken i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--min),var(--max))}

  /* Trend */
  #trend{width:100%;display:block}
  #trend text{font-family:Inter,system-ui,sans-serif}
  .legende{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--leise);margin:8px 2px 0}
  .legende i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
  .legende .verlauf{display:inline-block;width:56px;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--sonne),rgba(255,255,255,.12));margin:0 5px;vertical-align:0}

  #status{text-align:center;color:var(--leise);padding:60px 0}
  footer{text-align:center;color:var(--leise);font-size:12px;padding:6px 0}
  footer a{color:var(--leise)}
  @media(max-width:380px){.tag{grid-template-columns:70px 40px 44px 1fr}.held .t{font-size:76px}}
</style>
</head>
<body>
<main>
  <div class="leiste">
    <button class="rund" id="ortBtn" title="Mein Standort">◎</button>
    <div class="ort" id="ortName" title="Doppeltipp: zurück zu Ergolding"><span>📍</span>Ergolding</div>
    <button class="rund" id="sucheBtn" title="Ort suchen">🔍</button>
  </div>
  <div id="suche"><input id="sucheFeld" placeholder="Ort suchen, z. B. Landshut" autocomplete="off"><div id="treffer"></div></div>

  <div id="status">Lade Wetter …</div>
  <div id="inhalt" hidden>
    <section class="held" id="jetzt"></section>

    <div class="karte">
      <div class="titel"><span id="vorKopf">Die nächsten Stunden</span></div>
      <div class="zeilen" id="abschnitte"></div>
    </div>

    <div class="karte">
      <div class="titel"><span id="tageKopf">Vorhersage</span>
        <div class="wahl" id="wahl"><button data-n="3">3</button><button data-n="5">5</button><button data-n="7">7</button><button data-n="14">14 Tage</button></div>
      </div>
      <div id="tage"></div>
    </div>

    <div class="karte">
      <div class="titel"><span id="trendKopf">Trend</span></div>
      <svg id="trend"></svg>
      <div class="legende">
        <span><i style="background:var(--max)"></i>Max (°C)</span>
        <span><i style="background:var(--min)"></i>Min (°C)</span>
        <span>💧 Regen</span>
        <span>☀ viel<span class="verlauf"></span>wenig</span>
      </div>
    </div>
  </div>
  <footer>Daten: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> (u. a. DWD) · <span id="stand"></span></footer>
</main>

<script>
const STANDARD = {name:"Ergolding", lat:48.5786, lon:12.2077};
let ort = STANDARD, daten = null, gewaehlt = 0, anzahl = 7;
try { const s = JSON.parse(localStorage.getItem("wetterOrt")); if (s && s.lat) ort = s; } catch(e){}
try { const n = +localStorage.getItem("wetterTage"); if ([3,5,7,14].includes(n)) anzahl = n; } catch(e){}

const TAGE = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const KURZ = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const RICHTUNG = ["N","NO","O","SO","S","SW","W","NW"];
const richtung = g => RICHTUNG[Math.round(g/45)%8];
const runde = t => Math.round(t)===0 ? 0 : Math.round(t);
const wtag = i => new Date(daten.daily.time[i]+"T12:00").getDay();

/* ---------- Symbole ---------- */
const WOLKE = (x,y,s,f="#f4f7fa") => `<path transform="translate(${x} ${y}) scale(${s})" d="M10 30h34a10 10 0 0 0 0-20 14 14 0 0 0-27 3 8.5 8.5 0 0 0-7 17z" fill="${f}" stroke="rgba(0,0,0,.12)" stroke-width="1"/>`;
const SONNE = (x,y,r) => { let s=`<g transform="translate(${x} ${y})" stroke="#ffc928" stroke-width="2.4" stroke-linecap="round">`;
  for(let i=0;i<8;i++){const a=i*Math.PI/4;s+=`<line x1="${Math.cos(a)*(r+4)}" y1="${Math.sin(a)*(r+4)}" x2="${Math.cos(a)*(r+8)}" y2="${Math.sin(a)*(r+8)}"/>`}
  return s+`</g><circle cx="${x}" cy="${y}" r="${r}" fill="#ffd84d"/>`; };
const MOND = (x,y) => `<path transform="translate(${x} ${y})" d="M8-12a13 13 0 1 0 10 19A11 11 0 0 1 8-12z" fill="#ffe9a3"/>`;
const TROPFEN = n => { let s=""; for(let i=0;i<n;i++) s+=`<path transform="translate(${22+i*10} ${37+(i%2)*3})" d="M0 0q4.5 6 0 9.5q-4.5-3.5 0-9.5z" fill="#6fb8ff"/>`; return s; };
const FLOCKEN = n => { let s=""; for(let i=0;i<n;i++) s+=`<text x="${18+i*11}" y="${50+(i%2)*3}" font-size="12" fill="#cfe8ff">✱</text>`; return s; };
const BLITZ = `<path d="M30 33l-5 10h6l-4 9 11-13h-6l4-6z" fill="#ffd84d"/>`;
const NEBEL = `<g stroke="#dfe6ec" stroke-width="3" stroke-linecap="round"><line x1="10" y1="22" x2="54" y2="22"/><line x1="6" y1="31" x2="50" y2="31"/><line x1="12" y1="40" x2="56" y2="40"/></g>`;

function symbol(code, nacht){
  let g;
  const himmel = nacht ? MOND(24,20) : SONNE(38,16,9);
  if (code===0) g = nacht ? MOND(28,24) : SONNE(32,26,12);
  else if (code<=2) g = himmel + WOLKE(4,14,.85);
  else if (code===3) g = WOLKE(4,6,1,"#dfe5ea");
  else if (code===45||code===48) g = NEBEL;
  else if (code>=95) g = WOLKE(4,0,1,"#aeb7bf") + BLITZ;
  else if ((code>=71&&code<=77)||code===85||code===86) g = WOLKE(4,0,1,"#dfe5ea") + FLOCKEN(code===71||code===85?2:3);
  else if (code>=80&&code<=82) g = himmel + WOLKE(4,4,.95) + TROPFEN(code===80?1:2);
  else if (code>=51) g = WOLKE(4,0,1,"#c9d2da") + TROPFEN(code===51||code===53||code===61?1:2);
  else g = WOLKE(4,6,1);
  return `<svg class="w" viewBox="0 0 64 54">${g}</svg>`;
}
function text(code){
  if(code===0)return"Klar";if(code<=2)return"Teils bewölkt";if(code===3)return"Bedeckt";if(code<=48)return"Nebel";
  if(code<=57)return"Nieselregen";if(code<=67)return"Regen";if(code<=77)return"Schnee";if(code<=82)return"Schauer";
  if(code<=86)return"Schneeschauer";return"Gewitter";
}
// Pfeil zeigt dorthin, wohin der Wind weht
const pfeil = (grad, kmh) => `<svg class="pfeil" viewBox="-10 -10 20 20" style="transform:rotate(${grad+180}deg)"><title>Wind aus ${richtung(grad)}${kmh!=null?", "+Math.round(kmh)+" km/h":""}</title><path d="M0-9L6 8 0 4-6 8z"/></svg>`;

/* ---------- Laden ---------- */
async function laden(){
  document.getElementById("ortName").innerHTML = "<span>📍</span>" + ort.name;
  const st = document.getElementById("status");
  if(!daten){ st.hidden=false; st.textContent="Lade Wetter …"; }
  const url = "https://api.open-meteo.com/v1/forecast?latitude="+ort.lat+"&longitude="+ort.lon+
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,relative_humidity_2m,is_day"+
    "&hourly=temperature_2m,precipitation_probability,weather_code,wind_direction_10m,wind_speed_10m"+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,sunshine_duration,daylight_duration,precipitation_probability_max,precipitation_sum,wind_direction_10m_dominant,wind_speed_10m_max,sunrise,sunset"+
    "&timezone=Europe%2FBerlin&forecast_days=14";
  try{
    const r = await fetch(url); if(!r.ok) throw new Error(r.status);
    daten = await r.json(); if(gewaehlt>=anzahl) gewaehlt=0; zeigen();
  }catch(e){ if(!daten){ st.hidden=false; st.textContent = "Wetter konnte nicht geladen werden. Bitte später nochmal versuchen."; } }
}

const ABSCHN = [["Nacht",0],["Vormittag",6],["Nachmittag",12],["Abend",18]];
function abschnitt(startIdx, name){
  const h = daten.hourly, ids = [];
  for(let i=startIdx;i<startIdx+6 && i<h.time.length;i++) ids.push(i);
  if(startIdx<0 || !ids.length) return null;
  const temps = ids.map(i=>h.temperature_2m[i]);
  const t = name==="Nacht" ? Math.min(...temps) : (name==="Abend" ? temps.reduce((a,b)=>a+b)/temps.length : Math.max(...temps));
  const codes = ids.map(i=>h.weather_code[i]);
  const nass = codes.filter(c=>c>=51);
  const code = nass.length>=2 ? Math.max(...nass) : mode(codes.filter(c=>c<51));
  const mitte = ids[Math.floor(ids.length/2)];
  return {name, t, code, nacht:name==="Nacht"||name==="Abend", regen:Math.max(...ids.map(i=>h.precipitation_probability[i]??0)),
          wind:h.wind_direction_10m[mitte], kmh:h.wind_speed_10m[mitte]};
}
function mode(a){ if(!a.length) return 3; const z={}; a.forEach(c=>z[c]=(z[c]||0)+1); return +Object.keys(z).sort((x,y)=>z[y]-z[x]||y-x)[0]; }

function zeigen(){
  document.getElementById("status").hidden = true;
  document.getElementById("inhalt").hidden = false;
  const c = daten.current, d = daten.daily;
  const zeit = s => s.slice(11,16);
  document.getElementById("jetzt").innerHTML =
    `<div class="gross">${symbol(c.weather_code, !c.is_day)}<div class="t">${runde(c.temperature_2m)}°</div></div>
     <div class="beschr">${text(c.weather_code)}</div>
     <div class="hl">H: ${runde(d.temperature_2m_max[0])}°  ·  T: ${runde(d.temperature_2m_min[0])}°</div>
     <div class="chips">
       <span class="chip">🌡 gefühlt ${runde(c.apparent_temperature)}°</span>
       <span class="chip">💨 ${richtung(c.wind_direction_10m)} ${Math.round(c.wind_speed_10m)} km/h</span>
       <span class="chip">💧 ${c.relative_humidity_2m} %</span>
       <span class="chip">🌅 ${zeit(d.sunrise[0])} · 🌇 ${zeit(d.sunset[0])}</span>
     </div>`;
  document.getElementById("stand").textContent = "Stand " + new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) + " Uhr";
  abschnitteZeigen(); tageZeigen(); trendZeigen();
}

function tagName(i){ if(i===0) return "Heute"; if(i===1) return "Morgen"; return TAGE[wtag(i)]; }
function datumKurz(i){ const [,m,t] = daten.daily.time[i].split("-"); return (+t)+"."+(+m)+"."; }

function abschnitteZeigen(){
  const h = daten.hourly, liste = [];
  if(gewaehlt===0){
    const std = new Date(daten.current.time).getHours();
    let start = h.time.indexOf(daten.daily.time[0]+"T00:00") + Math.floor(std/6)*6;
    for(let k=0;k<4;k++){ liste.push(abschnitt(start, ABSCHN[(start/6)%4][0])); start+=6; }
    document.getElementById("vorKopf").textContent = "Die nächsten Stunden";
  }else{
    const s = h.time.indexOf(daten.daily.time[gewaehlt]+"T00:00");
    ABSCHN.forEach(([n,o])=>liste.push(abschnitt(s+o,n)));
    document.getElementById("vorKopf").textContent = tagName(gewaehlt) + ", " + datumKurz(gewaehlt);
  }
  document.getElementById("abschnitte").innerHTML = liste.filter(Boolean).map(a=>`
    <div><div class="lbl">${a.name}</div>
    <div class="temp">${runde(a.t)}°</div>
    <div class="sym" title="${text(a.code)}">${symbol(a.code,a.nacht)}${pfeil(a.wind,a.kmh)}</div>
    <div class="klein">💧 ${a.regen} %</div></div>`).join("");
}

function tageZeigen(){
  const d = daten.daily;
  document.querySelectorAll("#wahl button").forEach(b=>b.classList.toggle("an", +b.dataset.n===anzahl));
  document.getElementById("tageKopf").textContent = "Vorhersage";
  const n = Math.min(anzahl, d.time.length);
  const lo = Math.min(...d.temperature_2m_min.slice(0,n)), hi = Math.max(...d.temperature_2m_max.slice(0,n));
  const pos = t => ((t-lo)/((hi-lo)||1)*100).toFixed(1);
  let html = "";
  for(let i=0;i<n;i++){
    html += `<div class="tag ${i===gewaehlt?"aktiv":""}" data-i="${i}">
      <div class="name">${tagName(i)}<small>${datumKurz(i)}</small></div>
      <div title="${text(d.weather_code[i])}">${symbol(d.weather_code[i],false)}</div>
      <div class="rg">💧${d.precipitation_probability_max[i]??"–"}%<b>☀ ${Math.round(d.sunshine_duration[i]/3600)} h</b></div>
      <div class="spanne"><span class="mn">${runde(d.temperature_2m_min[i])}°</span>
        <div class="balken"><i style="left:${pos(d.temperature_2m_min[i])}%;right:${100-pos(d.temperature_2m_max[i])}%"></i></div>
        <span class="mx">${runde(d.temperature_2m_max[i])}°</span>${pfeil(d.wind_direction_10m_dominant[i],d.wind_speed_10m_max[i])}</div>
    </div>`;
  }
  document.getElementById("tage").innerHTML = html;
  document.querySelectorAll(".tag").forEach(el=>el.onclick=()=>{
    gewaehlt = +el.dataset.i; tageZeigen(); abschnitteZeigen();
    document.getElementById("abschnitte").scrollIntoView({behavior:"smooth",block:"center"});
  });
}

/* ---------- Trend-Diagramm ---------- */
function kurve(p){ // weiche Linie durch alle Punkte
  if(p.length<2) return "";
  let s = `M${p[0][0]},${p[0][1]}`;
  for(let i=0;i<p.length-1;i++){
    const p0=p[i-1]||p[i], p1=p[i], p2=p[i+1], p3=p[i+2]||p2;
    s += ` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;
  }
  return s;
}
function trendZeigen(){
  const d = daten.daily, n = Math.min(anzahl, d.time.length);
  document.getElementById("trendKopf").textContent = n + "-Tage-Trend";
  const svg = document.getElementById("trend");
  const W = Math.max(svg.clientWidth || 600, 280), spalte = W/n;
  const oben = 30, diaH = 190, unten = oben+diaH, bandY = unten+14, bandH = 30, H = bandY+bandH+2;
  const mx = d.temperature_2m_max.slice(0,n), mn = d.temperature_2m_min.slice(0,n);
  const hi = Math.max(...mx), lo = Math.min(...mn);
  const y = t => oben + 22 + (hi-t)/((hi-lo)||1)*(diaH-56);
  const x = i => spalte*i + spalte/2;
  const fs = n>10 ? 12 : 14;
  let g = "";
  for(let i=0;i<n;i++){
    const wt = wtag(i), we = wt===0||wt===6;
    if(we) g += `<rect x="${spalte*i}" y="0" width="${spalte}" height="${unten}" fill="rgba(255,255,255,.06)"/>`;
    g += `<text x="${x(i)}" y="18" text-anchor="middle" font-size="${fs}" font-weight="${we?700:500}" fill="${i===0?"#fff":"rgba(242,246,250,.75)"}">${i===0&&n<=7?"Heute":KURZ[wt]}</text>`;
  }
  if(lo<0 && hi>0) g += `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(255,255,255,.18)" stroke-dasharray="4 4"/><text x="4" y="${y(0)-4}" font-size="10" fill="rgba(242,246,250,.5)">0°</text>`;
  const pMax = mx.map((t,i)=>[x(i),y(t)]), pMin = mn.map((t,i)=>[x(i),y(t)]);
  // Fläche zwischen Min und Max
  const rueck = kurve([...pMin].reverse()).replace(/^M[^C]*/,"");
  g += `<path d="${kurve(pMax)} L${pMin[n-1][0]},${pMin[n-1][1]} ${rueck} Z" fill="url(#flaeche)" opacity=".28"/>`;
  g += `<path d="${kurve(pMax)}" fill="none" stroke="var(--max)" stroke-width="2.5" stroke-linecap="round"/>`;
  g += `<path d="${kurve(pMin)}" fill="none" stroke="var(--min)" stroke-width="2.5" stroke-linecap="round"/>`;
  for(let i=0;i<n;i++){
    g += `<circle cx="${pMax[i][0]}" cy="${pMax[i][1]}" r="4" fill="var(--max)" stroke="#0d2a4a" stroke-width="1.5"/>`;
    g += `<circle cx="${pMin[i][0]}" cy="${pMin[i][1]}" r="4" fill="var(--min)" stroke="#0d2a4a" stroke-width="1.5"/>`;
    g += `<text x="${x(i)}" y="${pMax[i][1]-10}" text-anchor="middle" font-size="${fs}" font-weight="600" fill="var(--max)">${runde(mx[i])}°</text>`;
    g += `<text x="${x(i)}" y="${pMin[i][1]+21}" text-anchor="middle" font-size="${fs}" font-weight="600" fill="var(--min)">${runde(mn[i])}°</text>`;
    // Sonnen-Band: je gelber, desto mehr Sonne
    const anteil = Math.min(1, d.sunshine_duration[i] / (d.daylight_duration[i]||1));
    g += `<rect x="${spalte*i+1}" y="${bandY}" width="${spalte-2}" height="${bandH}" rx="6" fill="rgba(255,216,77,${(.08+anteil*.85).toFixed(2)})"><title>${tagName(i)}: ${Math.round(d.sunshine_duration[i]/3600)} h Sonne, ${(d.precipitation_sum[i]||0).toFixed(1)} mm Regen</title></rect>`;
    // Regentropfen nach Regenmenge
    const mm = d.precipitation_sum[i]||0, tropfen = mm>=5?3:mm>=2?2:mm>=0.3?1:0;
    for(let k=0;k<tropfen;k++){
      const tx = x(i) + (k-(tropfen-1)/2)*(n>10?7:9), ty = bandY+8;
      g += `<path transform="translate(${tx} ${ty})" d="M0 0q5 7 0 12q-5-5 0-12z" fill="#6fb8ff" stroke="#0d2a4a" stroke-width=".8"/>`;
    }
  }
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);
  svg.innerHTML = `<defs><linearGradient id="flaeche" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb15c"/><stop offset="1" stop-color="#7cc7ff"/></linearGradient></defs>` + g;
}

/* ---------- Bedienung ---------- */
document.querySelectorAll("#wahl button").forEach(b=>b.onclick=()=>{
  anzahl = +b.dataset.n; try{localStorage.setItem("wetterTage",anzahl)}catch(e){}
  if(gewaehlt>=anzahl){ gewaehlt=0; abschnitteZeigen(); }
  tageZeigen(); trendZeigen();
});
let rTimer; window.addEventListener("resize",()=>{ clearTimeout(rTimer); rTimer=setTimeout(()=>daten&&trendZeigen(),150); });

function ortSetzen(o){ ort=o; daten=null; gewaehlt=0; try{localStorage.setItem("wetterOrt",JSON.stringify(o))}catch(e){}
  document.getElementById("suche").classList.remove("offen"); document.getElementById("sucheFeld").value=""; document.getElementById("treffer").innerHTML="";
  document.getElementById("inhalt").hidden=true; laden(); }
document.getElementById("sucheBtn").onclick = ()=>{ const s=document.getElementById("suche"); s.classList.toggle("offen"); if(s.classList.contains("offen")) document.getElementById("sucheFeld").focus(); };
let sTimer;
document.getElementById("sucheFeld").oninput = e => {
  clearTimeout(sTimer); const q = e.target.value.trim();
  if(q.length<2){ document.getElementById("treffer").innerHTML=""; return; }
  sTimer = setTimeout(async()=>{
    try{
      const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=6&language=de&name="+encodeURIComponent(q));
      const j = await r.json(); const box = document.getElementById("treffer");
      box.innerHTML = (j.results||[]).map((o,i)=>`<div data-i="${i}">${o.name} <small>${[o.admin1,o.country].filter(Boolean).join(", ")}</small></div>`).join("") || "<div><small>Nichts gefunden</small></div>";
      box.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{ const o=j.results[+el.dataset.i]; ortSetzen({name:o.name,lat:o.latitude,lon:o.longitude}); });
    }catch(err){}
  },300);
};
document.getElementById("ortBtn").onclick = ()=>{
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p=>ortSetzen({name:"Mein Standort",lat:+p.coords.latitude.toFixed(4),lon:+p.coords.longitude.toFixed(4)}),()=>{});
};
// Doppeltipp auf den Ortsnamen → zurück zu Ergolding
document.getElementById("ortName").ondblclick = ()=>ortSetzen(STANDARD);

laden();
setInterval(laden, 30*60*1000);
</script>
