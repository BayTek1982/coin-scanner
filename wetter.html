<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayazit Wetter</title>
<link rel="icon" type="image/svg+xml" href="icons/wetter.svg">
<meta name="theme-color" content="#13668f">
<style>
  :root{--blau:#13668f;--gelb:#f2c230;--text:#333;--grau:#777;--warm:#1e9e2f;--kalt:#2b8fe0;--hg:#eef1f4}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--hg);color:var(--text)}
  header{background:var(--blau);color:#fff;padding:14px 16px;border-bottom:3px solid var(--gelb);display:flex;align-items:center;gap:10px}
  header h1{flex:1;margin:0;font-size:22px;font-weight:500;text-align:center}
  header button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px}
  #suche{display:none;background:#fff;padding:10px 12px;border-bottom:1px solid #ddd}
  #suche.offen{display:block}
  #suche input{width:100%;font-size:17px;padding:10px;border:1px solid #bbb;border-radius:8px}
  #treffer div{padding:10px 6px;border-bottom:1px solid #eee;cursor:pointer}
  #treffer small{color:var(--grau)}
  main{max-width:900px;margin:0 auto;padding:12px}
  .karte{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.15);overflow:hidden;margin-bottom:14px}
  .kopf{background:var(--blau);color:#fff;padding:10px 14px;font-size:18px;border-bottom:3px solid var(--gelb)}
  .jetzt{display:flex;align-items:center;justify-content:center;gap:18px;padding:16px}
  .jetzt .t{font-size:48px;color:var(--warm)}
  .jetzt .info{color:var(--grau);font-size:15px;line-height:1.6}
  .zeilen{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
  .zeilen>div{padding:12px 4px}
  .lbl{color:var(--grau);font-size:15px}
  .temp{font-size:30px;margin:6px 0}
  .warm{color:var(--warm)} .kalt{color:var(--kalt)}
  .sym{display:flex;align-items:center;justify-content:center;gap:4px;height:56px}
  .sym svg.w{width:58px;height:46px}
  .pfeil{width:20px;height:20px;fill:#999}
  .klein{font-size:14px;color:#555;margin-top:6px}
  .tage{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-top:3px solid var(--blau)}
  .tag{flex:0 0 112px;text-align:center;padding:10px 4px 12px;cursor:pointer;scroll-snap-align:start}
  .tag.aktiv{background:#f3f6f9}
  .tag.aktiv .datum{background:var(--blau);color:#fff}
  .datum{padding:6px 0;margin:-10px -4px 6px;color:var(--grau);font-size:15px;line-height:1.35}
  .max{font-size:28px} .min{font-size:20px;margin-bottom:4px}
  #status{text-align:center;color:var(--grau);padding:30px}
  footer{text-align:center;color:var(--grau);font-size:12px;padding:6px 0 20px}
  footer a{color:var(--grau)}
  @media(min-width:700px){.tag{flex:1 0 112px}}
</style>
</head>
<body>
<header>
  <button id="ortBtn" title="Mein Standort">◎</button>
  <h1 id="ortName">Ergolding</h1>
  <button id="sucheBtn" title="Ort suchen">🔍</button>
</header>
<div id="suche"><input id="sucheFeld" placeholder="Ort eingeben, z. B. Landshut" autocomplete="off"><div id="treffer"></div></div>

<main>
  <div id="status">Lade Wetter …</div>
  <div id="inhalt" hidden>
    <div class="karte">
      <div class="kopf">Jetzt</div>
      <div class="jetzt" id="jetzt"></div>
    </div>
    <div class="karte">
      <div class="kopf" id="vorKopf">Vorhersage</div>
      <div class="zeilen" id="abschnitte"></div>
      <div class="tage" id="tage"></div>
    </div>
  </div>
  <footer>Daten: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> (DWD-Modelle) · <span id="stand"></span></footer>
</main>

<script>
const STANDARD = {name:"Ergolding", lat:48.5786, lon:12.2077};
let ort = STANDARD, daten = null, gewaehlt = 0;
try { const s = JSON.parse(localStorage.getItem("wetterOrt")); if (s && s.lat) ort = s; } catch(e){}

const TAGE = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const RICHTUNG = ["N","NO","O","SO","S","SW","W","NW"];

/* ---------- Symbole ---------- */
const WOLKE = (x,y,s,f="#e9ecef") => `<path transform="translate(${x} ${y}) scale(${s})" d="M10 30h34a10 10 0 0 0 0-20 14 14 0 0 0-27 3 8.5 8.5 0 0 0-7 17z" fill="${f}" stroke="#9aa3ab" stroke-width="1.5"/>`;
const SONNE = (x,y,r) => { let s=`<g transform="translate(${x} ${y})" stroke="#f2b705" stroke-width="2.2" stroke-linecap="round">`;
  for(let i=0;i<12;i++){const a=i*Math.PI/6;s+=`<line x1="${Math.cos(a)*(r+3)}" y1="${Math.sin(a)*(r+3)}" x2="${Math.cos(a)*(r+8)}" y2="${Math.sin(a)*(r+8)}"/>`}
  return s+`</g><circle cx="${x}" cy="${y}" r="${r}" fill="#ffdd00" stroke="#f2b705"/>`; };
const MOND = (x,y) => `<path transform="translate(${x} ${y})" d="M8-12a13 13 0 1 0 10 19A11 11 0 0 1 8-12z" fill="#f5e27a" stroke="#c9b13e"/>`;
const TROPFEN = n => { let s=""; for(let i=0;i<n;i++) s+=`<path transform="translate(${22+i*10} ${36+(i%2)*3})" d="M0 0q4 6 0 9q-4-3 0-9z" fill="#6fb3f2" stroke="#3d8ad6"/>`; return s; };
const FLOCKEN = n => { let s=""; for(let i=0;i<n;i++) s+=`<text x="${18+i*11}" y="${49+(i%2)*3}" font-size="12" fill="#7fb8e6">✱</text>`; return s; };
const BLITZ = `<path d="M30 33l-5 10h6l-4 9 11-13h-6l4-6z" fill="#ffcc00" stroke="#d9a400"/>`;
const NEBEL = `<g stroke="#9aa3ab" stroke-width="3" stroke-linecap="round"><line x1="10" y1="22" x2="54" y2="22"/><line x1="6" y1="31" x2="50" y2="31"/><line x1="12" y1="40" x2="56" y2="40"/></g>`;

function symbol(code, nacht){
  let g;
  const himmel = nacht ? MOND(24,20) : SONNE(38,16,9);
  if (code===0) g = nacht ? MOND(28,24) : SONNE(32,24,12);
  else if (code<=2) g = himmel + WOLKE(4,14,.85);
  else if (code===3) g = WOLKE(4,6,1);
  else if (code===45||code===48) g = NEBEL;
  else if (code>=95) g = WOLKE(4,0,1,"#c8cdd2") + BLITZ;
  else if ((code>=71&&code<=77)||code===85||code===86) g = WOLKE(4,0,1) + FLOCKEN(code===71||code===85?2:3);
  else if (code>=80&&code<=82) g = himmel + WOLKE(4,4,.95) + TROPFEN(code===80?1:2);
  else if (code>=51) g = WOLKE(4,0,1) + TROPFEN(code===51||code===53||code===61?1:2);
  else g = WOLKE(4,6,1);
  return `<svg class="w" viewBox="0 0 64 54">${g}</svg>`;
}
function text(code){
  if(code===0)return"klar";if(code<=2)return"teils bewölkt";if(code===3)return"bedeckt";if(code<=48)return"Nebel";
  if(code<=57)return"Nieselregen";if(code<=67)return"Regen";if(code<=77)return"Schnee";if(code<=82)return"Schauer";
  if(code<=86)return"Schneeschauer";return"Gewitter";
}
// Pfeil zeigt wie in der Vorlage dorthin, wohin der Wind weht
const pfeil = (grad, kmh) => `<svg class="pfeil" viewBox="-10 -10 20 20" style="transform:rotate(${grad+180}deg)"><title>Wind aus ${RICHTUNG[Math.round(grad/45)%8]}${kmh!=null?", "+Math.round(kmh)+" km/h":""}</title><path d="M0-9L6 8 0 4-6 8z"/></svg>`;
const tempKl = t => t<0 ? "kalt" : "warm";
const runde = t => Math.round(t)===0 ? 0 : Math.round(t);

/* ---------- Laden ---------- */
async function laden(){
  document.getElementById("ortName").textContent = ort.name;
  document.getElementById("status").hidden = false;
  document.getElementById("status").textContent = "Lade Wetter …";
  const url = "https://api.open-meteo.com/v1/forecast?latitude="+ort.lat+"&longitude="+ort.lon+
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,relative_humidity_2m,is_day"+
    "&hourly=temperature_2m,precipitation_probability,weather_code,wind_direction_10m,wind_speed_10m"+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,sunshine_duration,precipitation_probability_max,precipitation_sum,wind_direction_10m_dominant,wind_speed_10m_max"+
    "&timezone=Europe%2FBerlin&forecast_days=10";
  try{
    const r = await fetch(url); if(!r.ok) throw new Error(r.status);
    daten = await r.json(); gewaehlt = 0; zeigen();
  }catch(e){ document.getElementById("status").textContent = "Wetter konnte nicht geladen werden. Bitte später nochmal versuchen."; }
}

/* 4 Abschnitte eines Tages: Nacht 0–6, Vormittag 6–12, Nachmittag 12–18, Abend 18–24 */
const ABSCHN = [["Nacht",0],["Vormittag",6],["Nachmittag",12],["Abend",18]];
function abschnitt(startIdx, name){
  const h = daten.hourly, ids = [];
  for(let i=startIdx;i<startIdx+6 && i<h.time.length;i++) ids.push(i);
  if(!ids.length) return null;
  const temps = ids.map(i=>h.temperature_2m[i]);
  const nacht = name==="Nacht"||name==="Abend";
  const t = name==="Nacht" ? Math.min(...temps) : (name==="Abend" ? temps.reduce((a,b)=>a+b)/temps.length : Math.max(...temps));
  // Symbol: häufigstes Wetter, bei Niederschlag zählt das stärkste
  const codes = ids.map(i=>h.weather_code[i]);
  const nass = codes.filter(c=>c>=51);
  const code = nass.length>=2 ? Math.max(...nass) : mode(codes.filter(c=>c<51));
  const mitte = ids[Math.floor(ids.length/2)];
  return {name, t, code, nacht, regen:Math.max(...ids.map(i=>h.precipitation_probability[i]??0)),
          wind:h.wind_direction_10m[mitte], kmh:h.wind_speed_10m[mitte]};
}
function mode(a){ if(!a.length) return 3; const z={}; a.forEach(c=>z[c]=(z[c]||0)+1); return +Object.keys(z).sort((x,y)=>z[y]-z[x]||y-x)[0]; }

function zeigen(){
  document.getElementById("status").hidden = true;
  document.getElementById("inhalt").hidden = false;
  const c = daten.current;
  document.getElementById("jetzt").innerHTML =
    `${symbol(c.weather_code, !c.is_day)}<div class="t ${tempKl(c.temperature_2m)}">${runde(c.temperature_2m)}°</div>
     <div class="info">${text(c.weather_code)}<br>gefühlt ${runde(c.apparent_temperature)}° · Luftfeuchte ${c.relative_humidity_2m} %<br>
     Wind ${RICHTUNG[Math.round(c.wind_direction_10m/45)%8]} ${Math.round(c.wind_speed_10m)} km/h</div>`;
  document.getElementById("stand").textContent = "Stand " + new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) + " Uhr";
  abschnitteZeigen(); tageZeigen();
}

function abschnitteZeigen(){
  const h = daten.hourly, liste = [];
  if(gewaehlt===0){
    // die nächsten 4 Abschnitte ab jetzt
    const jetzt = new Date(daten.current.time); const std = jetzt.getHours();
    let start = h.time.indexOf(daten.daily.time[0]+"T00:00") + Math.floor(std/6)*6;
    for(let k=0;k<4;k++){ const name = ABSCHN[((start/6)%4+4)%4][0]; liste.push(abschnitt(start,name)); start+=6; }
    document.getElementById("vorKopf").textContent = "Vorhersage";
  }else{
    const s = h.time.indexOf(daten.daily.time[gewaehlt]+"T00:00");
    ABSCHN.forEach(([n,o])=>liste.push(abschnitt(s+o,n)));
    document.getElementById("vorKopf").textContent = "Vorhersage – " + tagName(gewaehlt);
  }
  document.getElementById("abschnitte").innerHTML = liste.filter(Boolean).map(a=>`
    <div><div class="lbl">${a.name}</div>
    <div class="temp ${tempKl(a.t)}">${runde(a.t)}°</div>
    <div class="sym" title="${text(a.code)}">${symbol(a.code,a.nacht)}${pfeil(a.wind,a.kmh)}</div>
    <div class="klein">💧 ${a.regen} %</div></div>`).join("");
}

function tagName(i){
  if(i===0) return "heute"; if(i===1) return "morgen";
  return TAGE[new Date(daten.daily.time[i]+"T12:00").getDay()];
}
function tageZeigen(){
  const d = daten.daily;
  document.getElementById("tage").innerHTML = d.time.map((t,i)=>{
    const [j,m,tg] = t.split("-");
    return `<div class="tag ${i===gewaehlt?"aktiv":""}" data-i="${i}">
      <div class="datum">${tagName(i)}<br>${+tg}.${+m}.</div>
      <div class="max ${tempKl(d.temperature_2m_max[i])}">${runde(d.temperature_2m_max[i])}°</div>
      <div class="min ${tempKl(d.temperature_2m_min[i])}">${runde(d.temperature_2m_min[i])}°</div>
      <div class="sym" title="${text(d.weather_code[i])}">${symbol(d.weather_code[i],false)}${pfeil(d.wind_direction_10m_dominant[i],d.wind_speed_10m_max[i])}</div>
      <div class="klein">☀ ${Math.round(d.sunshine_duration[i]/3600)} h</div>
      <div class="klein">💧 ${d.precipitation_probability_max[i]??"–"} %</div>
    </div>`;}).join("");
  document.querySelectorAll(".tag").forEach(el=>el.onclick=()=>{
    gewaehlt = +el.dataset.i; tageZeigen(); abschnitteZeigen();
  });
}

/* ---------- Ort suchen / Standort ---------- */
function ortSetzen(o){ ort=o; try{localStorage.setItem("wetterOrt",JSON.stringify(o))}catch(e){} document.getElementById("suche").classList.remove("offen"); laden(); }
document.getElementById("sucheBtn").onclick = ()=>{ const s=document.getElementById("suche"); s.classList.toggle("offen"); if(s.classList.contains("offen")) document.getElementById("sucheFeld").focus(); };
let timer;
document.getElementById("sucheFeld").oninput = e => {
  clearTimeout(timer); const q = e.target.value.trim();
  if(q.length<2){ document.getElementById("treffer").innerHTML=""; return; }
  timer = setTimeout(async()=>{
    try{
      const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=6&language=de&name="+encodeURIComponent(q));
      const j = await r.json(); const box = document.getElementById("treffer");
      box.innerHTML = (j.results||[]).map((o,i)=>`<div data-i="${i}">${o.name} <small>${[o.admin1,o.country].filter(Boolean).join(", ")}</small></div>`).join("") || "<div><small>Nichts gefunden</small></div>";
      box.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{ const o=j.results[+el.dataset.i]; ortSetzen({name:o.name,lat:o.latitude,lon:o.longitude}); });
    }catch(err){}
  },300);
};
document.getElementById("ortBtn").onclick = ()=>{
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async p=>{
    const lat=+p.coords.latitude.toFixed(4), lon=+p.coords.longitude.toFixed(4);
    ortSetzen({name:"Mein Standort",lat,lon});
  },()=>{ ortSetzen(STANDARD); });
};
// Doppeltipp auf den Ortsnamen → zurück zu Ergolding
document.getElementById("ortName").ondblclick = ()=>ortSetzen(STANDARD);

laden();
setInterval(laden, 30*60*1000);
</script>
</body>
</html>
