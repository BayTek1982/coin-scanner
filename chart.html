<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weiter zum Live-Chart · Bayazit</title>
<meta name="robots" content="noindex">
<script>
// Der Chart-Bot ist im Live-Chart aufgegangen. Alte Links (#m=…&s=…&tf=…) werden mit Markt, Symbol und Zeitrahmen weitergeleitet.
(function(){var h=new URLSearchParams(location.hash.slice(1)),q=new URLSearchParams();
["m","s","tf"].forEach(function(k){if(h.get(k))q.set(k,h.get(k))});
location.replace("https://chart.kompassapps.de/"+(q.toString()?"#"+q.toString():""))})();
</script>
<style>body{font:16px system-ui,sans-serif;background:#0e131b;color:#e7ecf3;display:grid;place-items:center;min-height:100vh;margin:0}a{color:#f0a33a}</style>
</head><body><p>Der Chart-Bot ist jetzt der <a href="https://chart.kompassapps.de/">Live-Chart</a>. Du wirst weitergeleitet …</p></body></html>
