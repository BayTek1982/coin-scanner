name: Kurse Dauerlauf
# Ersetzt die Zeitpläne von "Aktienkurse" und "Markt Tagesverlauf": GitHub lässt viele geplante Läufe ausfallen.
# Der Zeitplan hier ist nur der Starter; läuft schon einer, wartet der neue (concurrency).
on:
  schedule:
    - cron: "7 6-22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: kurse-live
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas lxml requests
      - run: bash scripts/kurse_loop.sh
        env:
          GH_TOKEN: ${{ github.token }}
          SOSO_API_KEY: ${{ secrets.SOSO_API_KEY }}
