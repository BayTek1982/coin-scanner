name: Markt Tagesverlauf
on:
  schedule:
    - cron: "3-59/15 6-23 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: markt-intraday
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python markt.py intraday
      # Daten in einen eigenen Branch ohne Verlauf, damit das Repo nicht immer größer wird
      - run: |
          cd markt_out
          git init -q
          git config user.name "kurs-bot"
          git config user.email "kurs-bot@users.noreply.github.com"
          git checkout -q -b markt-data
          git add .
          git commit -q -m "Markt Tagesverlauf $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" markt-data
