name: Aktien Risiko und Hitze
on:
  schedule:
    - cron: "47 22 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Verlauf aller Aktien neu schreiben (1 = ja)"
        default: "0"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - run: python stock_risk.py
        env:
          FULL: ${{ github.event.inputs.full }}
      - run: |
          git config user.name "kurs-bot"
          git config user.email "kurs-bot@users.noreply.github.com"
          git add data/srisk.json data/srisk
          git diff --staged --quiet || (git commit -m "Aktien Risiko und Hitze aktualisiert" && git pull --rebase && git push)

  # Wachhund: startet den Kurs-Dauerlauf, falls er gerade nicht läuft
  wachhund:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow kurse-live.yml --limit 20 --json status --jq '[.[]|select(.status!="completed")]|length')
          if [ "$n" = "0" ]; then gh workflow run kurse-live.yml -R "$GITHUB_REPOSITORY" --ref main && echo "Kurs-Dauerlauf gestartet"; else echo "Kurs-Dauerlauf läuft bereits"; fi
        env:
          GH_TOKEN: ${{ github.token }}
