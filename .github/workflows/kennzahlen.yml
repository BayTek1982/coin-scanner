name: Aktien Kennzahlen
on:
  schedule:
    - cron: "23 4 * * 2-6"
  workflow_dispatch:
    inputs:
      anzahl:
        description: "Nur so viele Aktien abrufen (leer = alle)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python markt.py kennzahlen
        env:
          KZ_LIMIT: ${{ inputs.anzahl }}
      - run: |
          git config user.name "kurs-bot"
          git config user.email "kurs-bot@users.noreply.github.com"
          git add data/kennzahlen.json
          git diff --staged --quiet || (git commit -m "Kennzahlen aktualisiert" && git pull --rebase && git push)
