name: Risiko-Indikator
on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python risk.py
      - run: |
          git config user.name "kurs-bot"
          git config user.email "kurs-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Risiko-Indikator aktualisiert" && git pull --rebase && git push)
