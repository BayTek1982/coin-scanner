name: Morgenroutine
on:
  schedule:
    - cron: "0 5 * * 1-5"    # werktags früh (06:00 Winterzeit / 07:00 Sommerzeit)
    - cron: "30 21 * * 1-5"  # nach US-Börsenschluss
    - cron: "0 12 * * 1-5"   # mittags (neue Termine, Europa-Kurse)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - morgenroutine.py
      - .github/workflows/morgenroutine.yml
permissions:
  contents: write
concurrency:
  group: morgenroutine
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests websocket-client
      - run: python morgenroutine.py
      - run: |
          git config user.name "kurs-bot"
          git config user.email "kurs-bot@users.noreply.github.com"
          git add data/morgenroutine.json data/morgenroutine_verlauf.json
          git diff --staged --quiet && exit 0
          git commit -m "Morgenroutine aktualisiert"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
