name: Earnings und IV Aktien
on:
  schedule:
    # 1x täglich nach US-Börsenschluss (Mo–Fr)
    - cron: "43 21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: earnings-iv
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      # bisher gesammelte IV-Historie holen (eigener Branch ohne Verlauf)
      - run: git clone -q --depth 1 --branch ev-data "https://github.com/${{ github.repository }}.git" prev || mkdir -p prev
      - run: python ev_fetch.py prev ev_out
      - run: |
          cd ev_out
          git init -q
          git config user.name "kurs-bot"
          git config user.email "kurs-bot@users.noreply.github.com"
          git checkout -q -b ev-data
          git add .
          git commit -q -m "Earnings/IV $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ev-data
