<style>

<script>
"use strict";
const RAW="https://raw.githubusercontent.com/BayTek1982/coin-scanner/gz-data/";
const TF={k:["1m","3m","5m","15m","30m","1h","2h","4h","12h","1d","1w","1M"],a:["1h","4h","1d","1w"]};
const TFLAB={"1m":"1m","3m":"3m","5m":"5m","15m":"15m","30m":"30m","1h":"1H","2h":"2H","4h":"4H","12h":"12H","1d":"1D","1w":"1W","1M":"1M"};
const OKXB={"1m":"1m","3m":"3m","5m":"5m","15m":"15m","30m":"30m","1h":"1H","2h":"2H","4h":"4H","12h":"12Hutc","1d":"1Dutc","1w":"1Wutc","1M":"1Mutc"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
async function getJSON(u,ms=20000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(t)}}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

// ---------- Zustand ----------
const saved=LS("blc1")||LS("bcb1")||{};
const S={ext:null,cur:saved.cur||"orig",fx:null,F:1,ccy:"$",kO:[],tool:null,dw:[],sel:null,pend:null,dwd:null,mag:saved.mag!==false,dwShared:false,mkt:"k",sym:saved.sym||"BTC",tf:saved.tf||"4h",cfg:CC.withDefaults(saved.cfg),profiles:saved.profiles||{},k:[],I:{},view:null,cross:null,src:"",list:{k:[],a:[]}};
(function readHash(){const h=new URLSearchParams(location.hash.slice(1));if(!h.get("s"))return;
  S.mkt="k";S.sym=h.get("s").toUpperCase().replace(/[^A-Z0-9.^=\-]/g,"");if(h.get("tf"))S.tf=h.get("tf");
  if(h.get("i"))try{S.cfg=CC.withDefaults(JSON.parse(decodeURIComponent(escape(atob(h.get("i"))))))}catch(e){}
  if(h.get("d"))try{S.hashDw=JSON.parse(decodeURIComponent(escape(atob(h.get("d")))))}catch(e){}})();
if(!TF[S.mkt].includes(S.tf))S.tf="1d";
const save=()=>LS("blc1",{mkt:S.mkt,sym:S.sym,tf:S.tf,cfg:S.cfg,profiles:S.profiles,cur:S.cur,mag:S.mag});

// ---------- Daten ----------
async function loadList(){
  try{const t=await getJSON("https://data-api.binance.vision/api/v3/ticker/24hr?type=MINI");
    S.list.k=t.filter(x=>/USDT$/.test(x.symbol)&&+x.closeTime>Date.now()-2*864e5).map(x=>({s:x.symbol.slice(0,-4),n:"",v:+x.quoteVolume})).filter(x=>!/^(USDC|FDUSD|TUSD|USDP|DAI|EUR|BUSD|USD1)$/.test(x.s)).sort((a,b)=>b.v-a.v)}catch(e){}
  try{const j=await getJSON(RAW+"gz_1d.json?t="+Math.floor(Date.now()/36e5),40000);S.list.a=(j.items||[]).map(x=>({s:x.y,n:x.n,c:x.c}))}catch(e){}}
async function klines(){const s=S.sym,tf=S.tf;
  if(S.mkt==="k"){
    try{const j=await getJSON(`https://data-api.binance.vision/api/v3/klines?symbol=${s}USDT&interval=${tf}&limit=1000`);
      if(Array.isArray(j)&&j.length)return{src:"Binance",k:j.map(r=>({t:+r[0],o:+r[1],h:+r[2],l:+r[3],c:+r[4],v:+r[5],b:+r[9]}))}}catch(e){}
    try{const j=await getJSON(`https://www.okx.com/api/v5/market/candles?instId=${s}-USDT&bar=${OKXB[tf]}&limit=300`);
      const d=(j.data||[]).map(r=>({t:+r[0],o:+r[1],h:+r[2],l:+r[3],c:+r[4],v:+r[5]})).reverse();if(d.length)return{src:"OKX",k:d}}catch(e){}
    throw new Error(`${s}/USDT wurde bei Binance und OKX nicht gefunden.`)}
  const j=await getJSON(RAW+"c/"+s.replace(/[^A-Za-z0-9.\-]/g,"_")+".json?t="+Math.floor(Date.now()/3e5));
  const rows=j[tf]||[];if(!rows.length)throw new Error(`Keine ${TFLAB[tf]}-Daten für ${s}.`);
  return{src:"Yahoo (stündlich)",k:rows.map(r=>({t:r[0],o:r[1],h:r[2],l:r[3],c:r[4],v:r[5]||0}))}}
// ---------- Risiko & Hitze (Daten aus dem Coin-Scanner, täglich per GitHub Actions) ----------
const HB=()=>Math.floor(Date.now()/36e5);let RIDX=null,SRIDX=null;const LONG={};
const dayOf=t=>Math.floor(t/864e5),wkDay=d=>d-((d+3)%7);

  if(S.tool){const t=S.tool,d={id:nid(),type:t,col:t==="tl"||t==="chan"?"#ffeb3b":t==="fib"?"#26c6da":t==="rect"?"#5b9bff":t==="text"?"#e7ecf3":"#f0a33a",w:2,pts:[pt]};
    if(t==="text"){const tx=prompt("Text:","");if(!tx){return true}d.text=tx.slice(0,80)}
    if(t==="long"||t==="short"){const lg=t==="long";d.type="pos";d.tp=pt.p*(lg?1.04:0.96);d.sl=pt.p*(lg?0.98:1.02);d.t2=CC.idxT(S.k,CC.tIdx(S.k,pt.t,S.tf)+20,S.tf)}
    if(t==="chan")d.off=-(L.hi-L.lo)*0.08/S.F;
    S.dw.push(d);
    if(TWO.includes(t)){d.pts[1]={...pt};S.pend=d;S.dwd={mode:"new",x,y,moved:false}}else{S.tool=null;S.sel=d.id;saveDw();renderTools()}
    paint();return true}
  const hit=hitDw(x,y);if(hit){S.sel=hit.d.id;S.dwd={id:hit.d.id,h:hit.h,start:pt,orig:JSON.parse(JSON.stringify(hit.d)),x,y,moved:false};paint();return true}
  if(S.sel){S.sel=null;paint()}return false}
function lineP(d,t){const a=d.pts[0],b=d.pts[1];if(!b||b.t===a.t)return a.p;return a.p+(b.p-a.p)*(t-a.t)/(b.t-a.t)}
function dwMove(x,y,pressed){if(!L)return false;
  if(S.pend&&S.dwd&&S.dwd.mode==="new"){if(Math.hypot(x-S.dwd.x,y-S.dwd.y)>6)S.dwd.moved=true;S.pend.pts[1]=toPt(x,y);paint();return true}
  if(S.pend){S.pend.pts[1]=toPt(x,y);paint();return true}
  if(S.dwd&&pressed){const g=S.dwd,d=S.dw.find(z=>z.id===g.id);if(!d)return false;const pt=toPt(x,y);if(Math.hypot(x-g.x,y-g.y)>3)g.moved=true;const o=g.orig;
    if(g.h==null){const dt=pt.t-g.start.t,dp=pt.p-g.start.p;d.pts=o.pts.map(q=>({t:q.t+dt,p:q.p+dp}));if(o.type==="pos"){d.tp=o.tp+dp;d.sl=o.sl+dp;d.t2=o.t2+dt}}
    else if(o.type==="pos"){if(g.h==="e"){const dp=pt.p-o.pts[0].p,dt=pt.t-o.pts[0].t;d.pts=[{t:o.pts[0].t+dt,p:pt.p}];d.tp=o.tp+dp;d.sl=o.sl+dp;d.t2=o.t2+dt}else if(g.h==="tp")d.tp=pt.p;else if(g.h==="sl")d.sl=pt.p;else if(g.h==="t2")d.t2=pt.t}
    else if(g.h==="off"){d.off=pt.p-lineP(d,pt.t)}
    else if(o.type==="hl"){d.pts=[{t:o.pts[0].t,p:pt.p}]}
    else d.pts[g.h]=pt;
    paint();return true}
  if(!pressed&&L){cv.style.cursor=S.tool?"crosshair":hitDw(x,y)?"move":cv.style.cursor}
  return false}
function dwUp(x,y){if(S.pend&&S.dwd&&S.dwd.mode==="new"){const moved=S.dwd.moved;S.dwd=null;if(moved){const d=S.pend;S.pend=null;S.tool=null;S.sel=d.id;saveDw();renderTools();paint()}return true}
  if(S.dwd){const g=S.dwd;S.dwd=null;if(g.moved)saveDw();return true}return false}
function renderEbar(){const b=$("ebar"),d=S.dw.find(z=>z.id===S.sel);if(!d){b.hidden=true;return}b.hidden=false;

function showSug(){const q=$("sym").value.trim().toUpperCase(),list=S.list[S.mkt];if(!q){$("sug").hidden=true;return}

  if(e.key==="Escape")$("sug").hidden=true});

  const k=S.kO,n=k.length,step=BSTEP[S.tf],has=BOD.key===bKey()&&BOD.st==="ok";
  const oi=new Array(n).fill(null),dOI=new Array(n).fill(null),sig=new Array(n).fill(false),ext=new Array(n).fill(false),szen=new Array(n).fill(0),delta=new Array(n),cvd=new Array(n);
  if(has){for(let i=0;i<n;i++){const v=BOD.oi.get(k[i].t+step);if(v!=null)oi[i]=v}
    if(oi[n-1]==null&&BOD.cur!=null&&(n<2||oi[n-2]!=null))oi[n-1]=BOD.cur}
  // Szenario je Kerze
  const absD=new Array(n).fill(null);
  for(let i=1;i<n;i++)if(oi[i]!=null&&oi[i-1]!=null){dOI[i]=oi[i]-oi[i-1];absD[i]=Math.abs(dOI[i])}
  const sl=Math.max(5,+c.sigLen||20);let run=0,cnt=0;const avg=new Array(n).fill(null);
  for(let i=0;i<n;i++){if(absD[i]==null){run=0;cnt=0;continue}run+=absD[i];cnt++;if(cnt>sl){run-=absD[i-sl];cnt=sl}if(cnt===sl)avg[i]=run/sl}
  for(let i=1;i<n;i++){if(dOI[i]==null)continue;const up=k[i].c>=k[i-1].c;szen[i]=up?(dOI[i]>0?1:2):(dOI[i]>0?3:4);
    if(avg[i]!=null){sig[i]=absD[i]>avg[i]*(+c.sigMult||1.5);ext[i]=absD[i]>avg[i]*(+c.extrem||3)}}
  // Volumen-Delta und CVD
  const dKey=t=>c.cvdReset==="tag"?Math.floor(t/864e5):c.cvdReset==="woche"?Math.floor((t/864e5+3)/7):0;let acc=0;
  for(let i=0;i<n;i++){const x=k[i];delta[i]=x.b!=null&&isFinite(x.b)?2*x.b-x.v:x.c>x.o?x.v:x.c<x.o?-x.v:0;
    if(i>0&&dKey(x.t)!==dKey(k[i-1].t))acc=0;acc+=delta[i];cvd[i]=acc}
  // Bezugszeitraum
  const last=n-1,R={oi,dOI,sig,ext,szen,delta,cvd,has};const cal=c.bezug==="tag"||c.bezug==="woche"||c.bezug==="monat";
  const nStd=Math.min(4900,Math.max(1,Math.round((+c.stunden||24)*36e5/step))),nB=c.bezug==="std"?nStd:Math.max(2,+c.n||20);
  let oiPct=null,dSum=null,pPct=null;
  if(cal){const per=t=>{const d=new Date(t);return c.bezug==="tag"?Math.floor(t/864e5):c.bezug==="woche"?Math.floor((t/864e5+3)/7):d.getUTCFullYear()*12+d.getUTCMonth()};
    let ref=last;while(ref>0&&per(k[ref-1].t)===per(k[last].t))ref--;
    if(ref>0||per(k[0].t)!==per(k[last].t)||true){const rO=ref>0&&oi[ref-1]!=null?oi[ref-1]:oi[ref],rC=ref>0?k[ref-1].c:k[ref].o;
      if(rO>0&&oi[last]!=null)oiPct=(oi[last]/rO-1)*100;pPct=(k[last].c/rC-1)*100;dSum=0;for(let i=ref;i<=last;i++)dSum+=delta[i]}}
  else if(last-nB>=0){if(oi[last-nB]>0&&oi[last]!=null)oiPct=(oi[last]/oi[last-nB]-1)*100;pPct=(k[last].c/k[last-nB].c-1)*100;dSum=0;for(let i=last-nB+1;i<=last;i++)dSum+=delta[i]}
  R.oiPct=oiPct;R.dSum=dSum;R.pPct=pPct;R.trend=oiPct==null||pPct==null?0:pPct>=0?(oiPct>0?1:2):(oiPct>0?3:4);
  R.divBaer=(pPct||0)>0&&(dSum||0)<0;R.divBulle=(pPct||0)<0&&(dSum||0)>0;
  R.bezK=c.bezug==="std"?c.stunden+" h":c.bezug==="tag"?"Tag":c.bezug==="woche"?"Woche":c.bezug==="monat"?"Monat":nB+" K";

  // OI-Lage (Rang) und letztes Extrem-Ereignis

  R.evBar=null;R.evTyp=0;for(let i=last-1;i>0;i--)if(ext[i]){R.evBar=i;R.evTyp=szen[i];break}
  BOD.R=R;bodTable()}

  const cK=c.fKauf,cV=c.fVerk,gr="var(--muted)",rows=[];const row=(a,at,b,col,bt)=>rows.push([a,at,b,col,bt]);

    const al=R.evBar==null?null:l-R.evBar;
    row("Ereig",`Letztes Extrem-Ereignis beim OI (Faktor ${String(c.extrem).replace(".",",")}× über normal).`,al==null?"–":EVK[R.evTyp]+" · "+al,al==null?gr:szCol(R.evTyp),al==null?EVL[0]:EVL[R.evTyp]+`\n\nVor ${al} Kerzen.`);
    let ft="–",fp="Kein klares Bild.",fc=gr;const ds=R.dSum||0;

function bodPaint(th){const box=$("bodBox");if(box.hidden||!L||!S.k.length)return;

  const x=cvs.getContext("2d");x.setTransform(d,0,0,d,0,0);const W=r.width,H=r.height,pw=L.pw,cw=L.cw,from=L.from,c=S.cfg.bod,R=BOD.R,n=S.k.length;

  const i0=Math.max(0,Math.floor(from)),i1=Math.min(n-1,Math.ceil(from+pw/cw));let lo=Infinity,hi=-Infinity;
  for(let i=i0;i<=i1;i++){const v=ser[i];if(v==null)continue;if(v<lo)lo=v;if(v>hi)hi=v}
  const ci=L.ci!=null&&L.ci>=0&&L.ci<n?L.ci:n-1;
  info.innerHTML=R.szen[ci]?`<b style="color:${szCol(R.szen[ci])}">${SZK[R.szen[ci]]}${R.sig[ci]?" !":""}</b> ΔOI ${fv(R.dOI[ci],1)} · OI ${fv(R.oi[ci])} · Delta <span style="color:${R.delta[ci]>=0?c.fKauf:c.fVerk}">${fv(R.delta[ci],1)}</span>`
    :`Delta <span style="color:${R.delta[ci]>=0?c.fKauf:c.fVerk}">${fv(R.delta[ci],1)}</span> · CVD ${fv(R.cvd[ci])}`;
  x.font='500 10px "JetBrains Mono",ui-monospace,monospace';x.textBaseline="middle";
  if(!isFinite(lo)){x.fillStyle=th.txt;x.textAlign="center";const st=BOD.key===bKey()?BOD.st:"lädt";
    x.fillText(st==="lädt"?"Open Interest wird geladen …":st==="tf"?`Kein Open Interest auf ${TFLAB[S.tf]} (verfügbar 5m bis 1D) – Volumen-Delta und CVD gehen trotzdem.`:"Kein Open Interest für diesen Bereich (höchstens 30 Tage zurück) – Volumen-Delta und CVD gehen trotzdem.",pw/2,H/2+8);return}
  if(col){lo=Math.min(lo,0);hi=Math.max(hi,0)}const pad=(hi-lo)*0.12||Math.abs(hi)*0.01||1;lo-=col&&lo===0?0:pad;hi+=col&&hi===0?0:pad;
  const T=24,B=H-5,Y=v=>B-(v-lo)/(hi-lo)*(B-T),X=i=>(i-from+0.5)*cw;
  x.strokeStyle=th.grid;x.lineWidth=1;x.fillStyle=th.txt;x.textAlign="left";
  for(let g=0;g<=2;g++){const v=lo+(hi-lo)*(g+0.5)/3,y=Math.round(Y(v))+.5;x.beginPath();x.moveTo(0,y);x.lineTo(pw,y);x.stroke();x.fillText(fv(v),pw+6,y)}
  x.save();x.beginPath();x.rect(0,0,pw,H);x.clip();
  if(col){const bw=Math.max(1,cw*0.7),y0=Y(0);
    for(let i=i0;i<=i1;i++){const v=ser[i];if(v==null)continue;x.fillStyle=m==="doi"?(c.grau&&!R.sig[i]?"rgba(128,128,128,.35)":szCol(R.szen[i])):(v>=0?c.fKauf:c.fVerk);
      const y=Y(v);x.fillRect(X(i)-bw/2,Math.min(y,y0),bw,Math.max(1,Math.abs(y-y0)))}}
  else{x.lineWidth=2;x.lineJoin="round";for(let i=Math.max(1,i0);i<=i1;i++){const v=ser[i],p=ser[i-1];if(v==null||p==null)continue;
      x.strokeStyle=m==="oi"?szCol(R.szen[i]):(v>=p?c.fKauf:c.fVerk);x.beginPath();x.moveTo(X(i-1),Y(p));x.lineTo(X(i),Y(v));x.stroke()}}
  if(m!=="oi"){x.strokeStyle="rgba(128,128,128,.5)";x.lineWidth=1;const y=Math.round(Y(0))+.5;x.beginPath();x.moveTo(0,y);x.lineTo(pw,y);x.stroke()}
  if(S.cross&&S.cross.x<pw){x.strokeStyle=th.cross;x.setLineDash([4,4]);x.beginPath();x.moveTo(S.cross.x+.5,0);x.lineTo(S.cross.x+.5,H);x.stroke();x.setLineDash([])}
  x.restore();
  let li=n-1;while(li>i0&&ser[li]==null)li--;const lv=ser[li];if(lv!=null&&li<=i1){const y=Y(lv),t=fv(lv);x.fillStyle=m==="oi"||m==="doi"?szCol(R.szen[li]):(m==="delta"?lv>=0:lv>=(ser[li-1]??lv))?c.fKauf:c.fVerk;
    x.fillRect(pw+1,y-7,W-pw-2,14);x.fillStyle="#111";x.textAlign="left";x.fillText(t,pw+6,y)}}

function bodMain(th){const c=S.cfg.bod,R=BOD.R;if(!c.on||!R||!L||(!c.kerzen&&!c.marker))return;const k=S.k,n=k.length,cw=L.cw,bw=Math.max(1,cw*0.7);
  ctx.save();ctx.beginPath();ctx.rect(0,0,L.pw,L.mainH);ctx.clip();

const HP={wc:null,pre:null};

  const pre=HP.pre,heat=new Array(n).fill(null);let j=0,any=false;

  if(any)ext.heat=heat;else delete ext.heat}

    [...el.children].forEach(x=>{x.style.background=c.cBg+"cc";if(!x.style.color)x.style.color=c.cTxt});

    const ty=o[0]==="o"?[p.top+5,"0"]:o[0]==="u"?[p.top+p.h-5,"-100%"]:[p.top+p.h/2,"-50%"],tx=o[1]==="l"?[6,"0"]:o[1]==="r"?[L.pw-6,"-100%"]:[L.pw/2,"-50%"];

    for(let i=Math.max(0,L.i0);i<=Math.min(n-1,L.i1);i++){const h=I.heat[i];if(h==null)continue;const x=L.X(i),q=k[i],col=CC.heatCol(h,I.heatTh);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1;
